<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f3">
    <meta
      name="description"
      content="Jacfit 知識庫助理，快速查詢產品與服務資訊。"
    >
    <title>Jacfit 知識庫助理</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#" aria-label="Jacfit 首頁">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="none">
              <path d="M11 12v16m18-16v16M7 16h8m10 0h8M7 24h8m10 0h8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
              <path d="M15 20h10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="brand-copy">
            <strong>JACFIT</strong>
            <span>KNOWLEDGE STUDIO</span>
          </span>
        </a>

        <div class="sidebar-label">你的工作空間</div>
        <div class="workspace-card">
          <span class="workspace-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H20v14H6.5A2.5 2.5 0 0 0 4 20.5v-14Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
              <path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20M8 8h8m-8 4h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="workspace-copy">
            <strong>Jacfit 知識庫</strong>
            <span>已連結知識來源</span>
          </span>
          <span class="status-dot" aria-label="已連線"></span>
        </div>

        <div class="sidebar-label prompt-label">試試這些問題</div>
        <div class="suggestion-list">
          <button class="suggestion" type="button" data-prompt="Jacfit 提供哪些服務？">
            <span aria-hidden="true">✳</span> Jacfit 提供哪些服務？
          </button>
          <button class="suggestion" type="button" data-prompt="如何開始使用 Jacfit？">
            <span aria-hidden="true">↗</span> 如何開始使用 Jacfit？
          </button>
          <button class="suggestion" type="button" data-prompt="有哪些常見問題與解答？">
            <span aria-hidden="true">⌕</span> 常見問題與解答
          </button>
        </div>

        <div class="sidebar-footer">
          <div class="privacy-note">
            <span class="privacy-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M12 3 19 6v5c0 4.5-2.8 7.8-7 10-4.2-2.2-7-5.5-7-10V6l7-3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                <path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span>回答根據已整理的知識庫內容</span>
          </div>
          <div class="account-row">
            <span class="avatar" id="user-avatar">J</span>
            <span class="account-copy">
              <strong id="user-email">尚未登入</strong>
              <span id="account-status">登入後開始提問</span>
            </span>
            <button class="text-button" id="sign-out" type="button" hidden>登出</button>
          </div>
        </div>
      </aside>

      <section class="main-panel">
        <header class="topbar">
          <div class="breadcrumb">
            <span>工作空間</span><span class="breadcrumb-slash">/</span>
            <strong>知識庫助理</strong>
          </div>
          <div class="topbar-right">
            <span class="connection-pill"><span class="status-dot"></span>安全連線</span>
            <button class="mobile-account" id="mobile-sign-out" type="button" hidden>登出</button>
          </div>
        </header>

        <div class="conversation" id="conversation" aria-live="polite">
          <div class="welcome" id="welcome">
            <div class="welcome-eyebrow"><span class="sparkle">✳</span> JACFIT KNOWLEDGE ASSISTANT</div>
            <h1>你好，今天有什麼<br><span>想了解的？</span></h1>
            <p class="welcome-copy">
              我會從 Jacfit 知識庫中尋找可靠資訊，<br class="desktop-break">
              幫你整理成清楚、好理解的答案。
            </p>
            <div class="welcome-cards">
              <button class="question-card" type="button" data-prompt="Jacfit 提供哪些服務？">
                <span class="card-icon mint" aria-hidden="true">✳</span>
                <span><strong>認識 Jacfit</strong><small>服務與品牌介紹</small></span>
                <span class="card-arrow" aria-hidden="true">↗</span>
              </button>
              <button class="question-card" type="button" data-prompt="有哪些常見問題與解答？">
                <span class="card-icon peach" aria-hidden="true">⌕</span>
                <span><strong>快速找答案</strong><small>瀏覽常見問題</small></span>
                <span class="card-arrow" aria-hidden="true">↗</span>
              </button>
              <button class="question-card" type="button" data-prompt="如何開始使用 Jacfit？">
                <span class="card-icon lilac" aria-hidden="true">↗</span>
                <span><strong>開始使用</strong><small>了解使用方式</small></span>
                <span class="card-arrow" aria-hidden="true">↗</span>
              </button>
            </div>
          </div>
          <div class="messages" id="messages"></div>
        </div>

        <div class="composer-wrap">
          <div class="auth-panel" id="auth-panel">
            <div class="auth-heading">
              <span class="auth-lock" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <rect x="5" y="10" width="14" height="11" rx="2.5" stroke="currentColor" stroke-width="1.7"/>
                  <path d="M8 10V7a4 4 0 1 1 8 0v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                </svg>
              </span>
              <div>
                <strong id="auth-title">登入後開始對話</strong>
                <span id="auth-description">使用你的 Jacfit 帳號安全登入</span>
              </div>
            </div>
            <form id="auth-form" class="auth-form">
              <label class="sr-only" for="email">電子郵件</label>
              <input id="email" name="email" type="email" placeholder="電子郵件" autocomplete="email" required>
              <label class="sr-only" for="password">密碼</label>
              <input id="password" name="password" type="password" placeholder="密碼（至少 6 個字元）" autocomplete="current-password" minlength="6" required>
              <button class="primary-button auth-submit" id="auth-submit" type="submit">登入</button>
              <button class="auth-switch" id="auth-switch" type="button">建立帳號</button>
            </form>
            <p class="auth-message" id="auth-message" role="status"></p>
          </div>

          <form class="composer" id="question-form">
            <label class="sr-only" for="question">輸入你的問題</label>
            <textarea id="question" name="question" rows="1" maxlength="500" placeholder="登入後即可詢問 Jacfit 知識庫…" disabled></textarea>
            <div class="composer-bottom">
              <span class="composer-hint"><span class="return-icon" aria-hidden="true">↵</span> Enter 傳送 · Shift + Enter 換行</span>
              <div class="composer-actions">
                <span class="character-count" id="character-count">0 / 500</span>
                <button class="send-button" id="send-button" type="submit" aria-label="傳送問題" disabled>
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 19V5m0 0L6 11m6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
              </div>
            </div>
          </form>
          <p class="disclaimer">AI 助理可能會有疏漏，重要資訊請以 Jacfit 官方公告為準。</p>
        </div>
      </section>
    </main>
  </body>
</html>
