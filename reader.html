<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'none'; connect-src 'none'; font-src 'none'; frame-src 'self' about:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>文件閱讀室 · KnowledgeSpace</title>
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/brand.css" />
    <link rel="stylesheet" href="./reader/reader.css" />
    <script type="module" src="./reader/assets/reader.js"></script>
  </head>
  <body class="ks-reader">
    <a class="ks-skip" href="#reader-article">跳到正文</a>
    <header class="ks-header">
      <a class="brand ks-brand" href="./reader.html" aria-label="Jacfit 文件閱讀首頁">
        <span class="brand-mark ks-brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none">
            <path
              d="M11 12v16m18-16v16M7 16h8m10 0h8M7 24h8m10 0h8"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
            />
            <path d="M15 20h10" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
          </svg>
        </span>
        <span class="brand-copy">
          <strong>JACFIT</strong>
          <span>KNOWLEDGE STUDIO</span>
        </span>
      </a>
      <div class="ks-tools">
        <a href="./index.html">返回 AI 問答 ↗</a>
        <label>
          <span>外觀</span>
          <select id="reader-theme" aria-label="外觀">
            <option value="system">跟隨系統</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
      </div>
    </header>
    <div class="ks-shell">
      <aside class="ks-sidebar">
        <details class="ks-navigation" open>
          <summary>瀏覽文件與章節</summary>
          <p class="ks-eyebrow">切換文件 · LOCAL DOCUMENTS</p>
          <nav id="reader-library" aria-label="合成文件"></nav>
          <p class="ks-local-note">
            合成文件預覽
            <br />
            不含私人知識來源
          </p>
          <div class="ks-toc-panel">
            <p class="ks-eyebrow">本頁章節</p>
            <nav id="reader-toc" aria-label="文章目錄"></nav>
          </div>
        </details>
      </aside>
      <main class="ks-main">
        <div class="ks-document-bar">
          <span id="reader-path"></span>
          <a id="reader-source">閱讀原始 Markdown ↗</a>
        </div>
        <p id="reader-status" role="status" class="ks-status"></p>
        <article id="reader-article" tabindex="-1" aria-label="文件正文">
          <p>正在準備文件。若未載入，請先執行 npm run build，或使用下方原始 Markdown。</p>
        </article>
        <noscript>
          <p>
            JavaScript 未啟用，仍可閱讀完整合成 Markdown：
            <a href="./reader/fixtures/guide.md">閱讀指南</a>
            、
            <a href="./reader/fixtures/examples/連結 範例.md">連結範例</a>
            、
            <a href="./reader/fixtures/safety.md">安全測試</a>
            。
          </p>
        </noscript>
        <details class="ks-raw-fallback">
          <summary>無法載入閱讀器？開啟完整原始文件</summary>
          <p>
            <a href="./reader/fixtures/guide.md">原始閱讀指南</a>
            ·
            <a href="./reader/fixtures/examples/連結%20範例.md">原始連結範例</a>
            ·
            <a href="./reader/fixtures/safety.md">原始安全範例</a>
          </p>
        </details>
        <footer class="ks-footer">
          KnowledgeSpace Reader
          <span>M1 · Synthetic fixtures only</span>
        </footer>
      </main>
    </div>
  </body>
</html>
